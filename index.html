<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utah Hunting Calendar</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<header class="masthead"><div class="wrap">
<p class="brand">Utah Hunting Calendar</p>
<nav aria-label="Main navigation"><a href="#home">Overview</a><a href="#calendar">Calendar</a><a href="#opportunities">Opportunities</a></nav>
</div></header>
<main class="wrap">
<p class="notice">Sample data for testing. Dates and availability are illustrative.</p>
<h1 id="heading" tabindex="-1">Utah Hunting Calendar</h1>
<section id="filters" aria-label="Filters" hidden>
<label>Search<input type="search" id="search" placeholder="Hunt name or area"></label>
<label>Species<select id="species"><option value="">All species</option></select></label>
<label>Permit type<select id="type"><option value="">All permit types</option></select></label>
<label>Status<select id="status"><option value="">All statuses</option><option>Upcoming</option><option>Open</option><option>Closed</option></select></label>
</section>
<div id="content" aria-live="polite">Loading calendar…</div>
</main>
</body>
</html>
